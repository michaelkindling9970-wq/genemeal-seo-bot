<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — GeneMeal SEO Bot Console</title>
  <meta name="description" content="Sign in to the GeneMeal SEO Bot live audit console. This operator login is private and is not a GeneMeal account." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="{{ origin }}/login" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%2334d399%27 stroke-width=%272%27%3E%3Cpath d=%27M12 2L14.8 8.2L21 9.2L16.5 13.6L17.6 20L12 16.9L6.4 20L7.5 13.6L3 9.2L9.2 8.2L12 2Z%27/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="console-login-body">
  <div class="aurora aurora-1" aria-hidden="true"></div>
  <div class="aurora aurora-2" aria-hidden="true"></div>

  <main class="console-login-shell">
    <section class="console-login-card glass-card">
      <div class="brand-cluster">
        <div class="bot-avatar" aria-hidden="true">
          <div class="bot-ring"></div>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 2L14.8 8.2L21 9.2L16.5 13.6L17.6 20L12 16.9L6.4 20L7.5 13.6L3 9.2L9.2 8.2L12 2Z" />
          </svg>
        </div>
        <div>
          <h1>GeneMeal SEO Bot</h1>
          <p class="brand-sub">Sign in to track the live audit console.</p>
        </div>
      </div>

      {% if error %}
      <p class="login-error" role="alert">{{ error }}</p>
      {% endif %}

      <form method="post" action="/login" class="console-login-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
        <input type="hidden" name="next" value="{{ next_url or '/' }}" />
        <label>Username
          <input type="text" name="username" value="{{ username or '' }}" required autocomplete="username" maxlength="64" {% if not configured %}disabled{% endif %} />
        </label>
        <label>Password
          <input type="password" name="password" required autocomplete="current-password" maxlength="128" {% if not configured %}disabled{% endif %} />
        </label>
        <label class="remember-row" for="remember">
          <input type="checkbox" id="remember" name="remember" value="1"{% if remember_checked %} checked{% endif %} />
          Remember me
        </label>
        <button class="btn btn-primary" type="submit"{% if not configured %} disabled{% endif %}>Sign in</button>
      </form>
    </section>
  </main>
</body>
</html>
