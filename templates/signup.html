{% extends "app_base.html" %}
{% block title %}Sign up — Traction{% endblock %}
{% block body %}
<section class="auth-card glass-card">
  <h2>Create a free Traction account</h2>
  <p class="panel-sub">Email and password only — no confirmation email is sent. Data may reset when this free service sleeps or redeploys.</p>
  <form method="post" action="/app/signup" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <label>Email
      <input type="email" name="email" value="{{ email or '' }}" required autocomplete="username" maxlength="254" />
    </label>
    <label>Password (8+ characters)
      <input type="password" name="password" required autocomplete="new-password" minlength="8" maxlength="128" />
    </label>
    <button class="btn btn-primary" type="submit">Sign up</button>
  </form>
  <p class="auth-switch">Already have an account? <a href="/app/login">Log in</a></p>
</section>
{% endblock %}
